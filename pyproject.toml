[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jaxmodal"
description = "Matrix-free large-scale 3D linear modal analysis in JAX"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = ["jax>=0.11.2", "numpy", "scipy", "meshio", "pyamg"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.hatch.version]
path = "src/jaxmodal/__init__.py"

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/shell_accuracy.py" = ["E402"]  # enable_x64 before the imports
"benchmarks/shell_amg_study.py" = ["E402"]  # enable_x64 before the imports (test helpers)
"benchmarks/shell_solve_study.py" = ["E402"]  # enable_x64 before the imports (test helpers)
"benchmarks/amg_fp32_study.py" = ["E402"]  # enable_x64 before the imports (test helpers)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running",
    "gpu: needs a CUDA device",
    "serial: asserts wall time or must run without other load; scripts/test.sh runs it alone",
    "peak: asserts a process memory peak; scripts/test.sh runs 3 at a time",
]
addopts = "--strict-markers"
